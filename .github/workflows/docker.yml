# 构建镜像并推送到 Docker Hub。
#
# 需要先配一个仓库 secret（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_TOKEN  —— Docker Hub 的 Access Token，权限勾 Read & Write
# 用户名不用配：就是下面的 hotpot1993。
#
# 手动触发时可以选 mode：
#   push        —— 构建并推送（默认）
#   build-only  —— 只构建、不推送，用来验证 Dockerfile 改动
#
# 构建的是 linux/amd64，与飞牛那台的架构一致。要出双架构的话把
# platforms 改成 linux/amd64,linux/arm64 即可（依赖轮子两种架构都验过）。

name: 构建并推送镜像

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: push 就构建并推送；build-only 只构建，用来验证 Dockerfile
        type: choice
        options:
          - push
          - build-only
        default: push

# 同一分支上后一次推上来就把前一次取消掉，别排着队空跑
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: 取源码
        uses: actions/checkout@v7

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v4

      # 判断条件写全：只有「不是手动触发」或「手动选了 push」才推。
      # 手选的 build-only 不推，是明说的，不是悄悄跳过。
      - name: 登录 Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'push' }}
        uses: docker/login-action@v4
        with:
          username: hotpot1993
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest 按分支名判断，不用 is_default_branch：
      # 默认分支要是没设成 master，latest 会静默地不打，而 compose 拉的正是
      # latest —— 那种失败在 NAS 上只表现为「拉不到镜像」。
      - name: 算标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hotpot1993/trip-planner
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=ref,event=tag

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存放在 Actions 的缓存里，下次构建前端依赖与 pip 都能快一截
          cache-from: type=gha
          cache-to: type=gha,mode=max
