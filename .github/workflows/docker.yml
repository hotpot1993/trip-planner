# 构建镜像并推送到 Docker Hub。
#
# 需要先配一个仓库 secret（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_TOKEN  —— Docker Hub 的 Access Token，权限勾 Read & Write
# 用户名不用配：就是下面的 hotpot1993。
#
# 手动触发时可以选 mode：
#   push        —— 构建并推送（默认）
#   build-only  —— 只构建、不推送，用来验证 Dockerfile 改动
#
# 构建的是 linux/amd64，与飞牛那台的架构一致。要出双架构的话把
# platforms 改成 linux/amd64,linux/arm64 即可（依赖轮子两种架构都验过）。

name: 构建并推送镜像

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: push 就构建并推送；build-only 只构建，用来验证 Dockerfile
        type: choice
        options:
          - push
          - build-only
        default: push

# 同一分支上后一次推上来就把前一次取消掉，别排着队空跑
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    # 把真正推上去的标签名传给冒烟那一步，免得在那边猜 sha 截几位
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 取源码
        uses: actions/checkout@v7

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v4

      # 判断条件写全：只有「不是手动触发」或「手动选了 push」才推。
      # 手选的 build-only 不推，是明说的，不是悄悄跳过。
      - name: 登录 Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'push' }}
        uses: docker/login-action@v4
        with:
          username: hotpot1993
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest 按分支名判断，不用 is_default_branch：
      # 默认分支要是没设成 master，latest 会静默地不打，而 compose 拉的正是
      # latest —— 那种失败在 NAS 上只表现为「拉不到镜像」。
      - name: 算标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hotpot1993/trip-planner
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=ref,event=tag

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存放在 Actions 的缓存里，下次构建前端依赖与 pip 都能快一截
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 把刚推上去的镜像真跑一遍。构建成功不等于跑得起来：入口脚本有没有执行位、
  # 前端有没有被挂上、库建不建得出来、健康检查探得通不通，只有起了才知道。
  #
  # 这一步在 push 之后，所以它要是红了，刚发布出去的那个 tag 就是坏的 ——
  # 修好再推一次会覆盖它。
  smoke:
    needs: image
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉下来跑一遍
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ needs.image.outputs.tags }}" | head -n1)
          echo "镜像：$IMAGE"
          docker pull "$IMAGE"

          # 不挂卷、不给任何 Key —— 这就是 NAS 上第一次起来的样子
          docker run -d --name lushu -p 8756:8756 "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -fsS -o health.json http://127.0.0.1:8756/api/health; then break; fi
            sleep 2
          done

          echo "--- /api/health ---"
          jq . health.json
          jq -e '.status == "ok"' health.json > /dev/null
          jq -e '.database.exists == true' health.json > /dev/null
          jq -e '.engine.available == true' health.json > /dev/null

          echo "--- 首页必须是前端，不是那句「前端尚未构建」---"
          curl -fsS http://127.0.0.1:8756/ -o index.html
          grep -q 'id="root"' index.html
          grep -q '/assets/' index.html

          echo "--- 数据目录：库建出来了没有、车站名表补上了没有 ---"
          docker exec lushu ls -l /app/data
          docker exec lushu test -f /app/data/lushu.db
          docker exec lushu test -f /app/data/rail_stations.json

          echo "--- 健康检查自己怎么说（别让 NAS 上一直显示 unhealthy）---"
          for _ in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' lushu)
            echo "  $status"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 3
          done
          docker inspect --format '{{.State.Health.Status}}' lushu | grep -q '^healthy$'

          echo "--- 启动日志 ---"
          docker logs lushu

      # NAS 上密钥就是这么给的：挂一个 .env.local 进去。这一段验的就是那条路 ——
      # 挂载点写错的话（比如挂成了 /app/.env 而不是 /app/.env.local），
      # 容器照样起得来，只是所有 Key 都缺，界面上只有一行小字。
      - name: 挂一个 .env.local 进去，确认键真的被读到
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ needs.image.outputs.tags }}" | head -n1)
          mkdir -p envcheck
          printf 'AMAP_API_KEY=dummy-amap\nAMAP_JS_KEY=dummy-js\nAMAP_JS_SECURITY_CODE=dummy-code\nLLM_PROVIDER=deepseek\nDEEPSEEK_API_KEY=dummy-deepseek\n' > envcheck/.env.local

          docker run -d --name lushu-env -p 8757:8756 \
            -v "$PWD/envcheck/.env.local:/app/.env.local:ro" "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -fsS -o health-env.json http://127.0.0.1:8757/api/health; then break; fi
            sleep 2
          done

          echo "--- 挂了 .env.local 之后的 warnings ---"
          jq '.warnings' health-env.json
          # 键读到了就不该再有任何「缺少配置」；这一条就是挂载点对不对的判据
          jq -e '.warnings | length == 0' health-env.json > /dev/null

      # Docker 挂一个不存在的宿主文件时会把那个路径建成目录，而 python-dotenv
      # 碰到目录既不报错也不加载。entrypoint 得把这种情况挡住。
      - name: 挂成目录时必须拒绝启动
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ needs.image.outputs.tags }}" | head -n1)
          mkdir -p envdir

          docker run -d --name lushu-bad -v "$PWD/envdir:/app/.env.local:ro" "$IMAGE"
          sleep 4

          code=$(docker inspect --format '{{.State.ExitCode}}' lushu-bad)
          echo "退出码：$code"
          docker logs lushu-bad 2>&1 | tail -6

          test "$code" = "1"
          docker logs lushu-bad 2>&1 | grep -q '是个目录'
